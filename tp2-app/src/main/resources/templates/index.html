<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TP2 — Gestion des Étudiants</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        header { background: linear-gradient(135deg,#1a73e8,#0d47a1); color:white; padding:18px 40px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { font-size:1.4rem; }
        .container { max-width:1100px; margin:28px auto; padding:0 20px; }
        .card { background:white; border-radius:12px; padding:24px; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
        .card h2 { color:#1a73e8; margin-bottom:18px; font-size:1.05rem; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .field { display:flex; flex-direction:column; gap:4px; }
        .field label { font-size:.82rem; color:#555; font-weight:600; }
        .field input, .field select { padding:10px 13px; border:1.5px solid #ddd; border-radius:8px; font-size:.9rem; }
        .field input:focus, .field select:focus { outline:none; border-color:#1a73e8; }
        .field input.is-invalid, .field select.is-invalid { border-color:#e53935; }
        .err { color:#e53935; font-size:.78rem; }
        .btn { padding:10px 24px; border:none; border-radius:8px; cursor:pointer; font-size:.9rem; font-weight:600; }
        .btn-primary { background:#1a73e8; color:white; margin-top:16px; }
        .btn-warning { background:#fb8c00; color:white; padding:5px 12px; font-size:.8rem; }
        .btn-danger { background:#e53935; color:white; padding:5px 12px; font-size:.8rem; }
        .btn-cancel { background:#eee; color:#555; margin-top:16px; margin-left:10px; }
        .alert { padding:12px 18px; border-radius:8px; margin-bottom:18px; font-size:.9rem; }
        .alert-success { background:#e8f5e9; color:#2e7d32; border-left:4px solid #4caf50; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        thead tr { background:#1a73e8; color:white; }
        th, td { padding:11px 14px; text-align:left; border-bottom:1px solid #eee; }
        tbody tr:hover { background:#e8f0fe; }
        .badge { display:inline-block; padding:3px 11px; border-radius:12px; font-size:.75rem; color:white; font-weight:600; }
        .b-info{background:#1a73e8} .b-devops{background:#7b1fa2} .b-cyber{background:#c62828} .b-reseau{background:#00897b} .b-data{background:#f57c00}
        .actions { display:flex; gap:6px; }
        .empty { text-align:center; color:#aaa; padding:40px; }
    </style>
</head>
<body>
<header>
    <h1>🎓 Gestion des Étudiants — TP2</h1>
    <span>srv-app 192.168.56.10 ↔ srv-db 192.168.56.11</span>
</header>
<div class="container">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <h2 th:text="${editMode} ? '✏️ Modifier' : '➕ Ajouter un étudiant'"></h2>

        <form th:if="${!editMode}" th:action="@{/etudiants/save}" th:object="${etudiant}" method="post">
            <div class="form-grid">
                <div class="field">
                    <label>Nom *</label>
                    <input th:field="*{nom}" placeholder="Ex: Diallo" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>
                <div class="field">
                    <label>Prénom *</label>
                    <input th:field="*{prenom}" placeholder="Ex: Mamadou" th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>
                <div class="field">
                    <label>Email *</label>
                    <input th:field="*{email}" type="email" placeholder="Ex: mamadou@tp2.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label>Filière *</label>
                    <select th:field="*{filiere}" th:classappend="${#fields.hasErrors('filiere')} ? 'is-invalid'">
                        <option value="">-- Choisir --</option>
                        <option value="Informatique">Informatique</option>
                        <option value="Réseaux">Réseaux &amp; Télécoms</option>
                        <option value="Cybersécurité">Cybersécurité</option>
                        <option value="DevOps">DevOps / Cloud</option>
                        <option value="Data">Data Science</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('filiere')}" th:errors="*{filiere}"></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
        </form>

        <form th:if="${editMode}" th:action="@{/etudiants/update/{id}(id=${etudiant.id})}" th:object="${etudiant}" method="post">
            <div class="form-grid">
                <div class="field">
                    <label>Nom *</label>
                    <input th:field="*{nom}" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>
                <div class="field">
                    <label>Prénom *</label>
                    <input th:field="*{prenom}" th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>
                <div class="field">
                    <label>Email *</label>
                    <input th:field="*{email}" type="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label>Filière *</label>
                    <select th:field="*{filiere}" th:classappend="${#fields.hasErrors('filiere')} ? 'is-invalid'">
                        <option value="">-- Choisir --</option>
                        <option value="Informatique">Informatique</option>
                        <option value="Réseaux">Réseaux &amp; Télécoms</option>
                        <option value="Cybersécurité">Cybersécurité</option>
                        <option value="DevOps">DevOps / Cloud</option>
                        <option value="Data">Data Science</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('filiere')}" th:errors="*{filiere}"></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">✅ Mettre à jour</button>
            <a th:href="@{/etudiants}"><button type="button" class="btn btn-cancel">Annuler</button></a>
        </form>
    </div>

    <div class="card">
        <h2>📋 Liste des étudiants
            <small style="color:#888;font-weight:normal" th:text="'(' + ${total} + ' inscrits)'"></small>
        </h2>
        <p class="empty" th:if="${#lists.isEmpty(etudiants)}">Aucun étudiant. Ajoutez-en un ci-dessus !</p>
        <table th:unless="${#lists.isEmpty(etudiants)}">
            <thead>
            <tr><th>#</th><th>Nom</th><th>Prénom</th><th>Email</th><th>Filière</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${etudiants}">
                <td th:text="${e.id}"></td>
                <td><strong th:text="${e.nom}"></strong></td>
                <td th:text="${e.prenom}"></td>
                <td th:text="${e.email}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${e.filiere == 'Informatique'} ? 'b-info'
                                         : (${e.filiere == 'DevOps'} ? 'b-devops'
                                         : (${e.filiere == 'Cybersécurité'} ? 'b-cyber'
                                         : (${e.filiere == 'Réseaux'} ? 'b-reseau' : 'b-data')))"
                              th:text="${e.filiere}">
                        </span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/etudiants/edit/{id}(id=${e.id})}">
                            <button class="btn btn-warning">✏️</button>
                        </a>
                        <a th:href="@{/etudiants/delete/{id}(id=${e.id})}"
                           onclick="return confirm('Supprimer cet étudiant ?')">
                            <button class="btn btn-danger">🗑</button>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
